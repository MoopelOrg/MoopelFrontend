<!DOCTYPE html>
<html lang="en">
<head>
    <script>
        window.FontAwesomeConfig = {
          autoReplaceSvg: 'nest'
        };
      </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Moopel — Tags</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['"Plus Jakarta Sans"', 'ui-sans-serif', 'system-ui', 'sans-serif'] },
          colors: {
            proton: {
              bg: '#0a0a14',
              surface: '#1a1a2e',
              accent: '#6d4aff',
              text: '#ffffff',
              muted: '#a1a1aa'
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      background: radial-gradient(circle at center, #1a1a2e 0%, #0a0a14 100%);
    }
    .drawer-transition { transition: transform 0.3s ease-in-out; }
    .drawer-overlay-transition { transition: opacity 0.3s ease-in-out; }
    .tag-row:hover { background-color: rgba(255, 255, 255, 0.04); }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="text-white font-sans h-screen w-full overflow-hidden flex flex-col selection:bg-proton-accent/30">

  <!-- Top Navigation Bar -->
  <header class="h-16 px-6 flex items-center justify-between z-20 flex-shrink-0 border-b border-white/5 bg-proton-surface/50 backdrop-blur-sm">
    <div class="flex items-center gap-4">
      <button id="drawer-open" class="p-2 hover:bg-white/10 rounded-lg transition-colors">
        <i class="ph ph-list text-2xl"></i>
      </button>
      <a href="Dashboard__desktop.html" class="flex items-center gap-2 group">
        <div class="w-8 h-8 rounded-lg bg-proton-accent flex items-center justify-center transition-transform group-hover:scale-105">
          <i class="ph-fill ph-house-line text-white text-lg"></i>
        </div>
        <span class="text-xl font-bold tracking-tight">Moopel</span>
      </a>
      <div class="h-4 w-px bg-white/10 mx-2"></div>
      <div class="flex items-center gap-2 text-proton-muted">
        <i class="ph-fill ph-tag text-rose-400"></i>
        <span class="text-sm font-semibold">Tags</span>
      </div>
    </div>
    
    <div class="flex items-center gap-4">

        E
      </div>
    </div>
  </header>

  <!-- Side Drawer -->
  <div id="drawer-overlay" class="fixed inset-0 bg-black/60 opacity-0 pointer-events-none z-30 drawer-overlay-transition"></div>
  <aside id="drawer" class="fixed top-0 left-0 h-full w-[280px] bg-proton-surface border-r border-white/5 z-40 -translate-x-full drawer-transition p-6 flex flex-col justify-between">
    <div>
      <div class="flex items-center justify-between mb-8">
        <div class="flex items-center gap-2">
          <div class="w-8 h-8 rounded-lg bg-proton-accent flex items-center justify-center">
            <i class="ph-fill ph-house-line text-white text-lg"></i>
          </div>
          <span class="text-lg font-bold">Moopel</span>
        </div>
        <button id="drawer-close" class="p-2 hover:bg-white/10 rounded-lg transition-colors">
          <i class="ph ph-x text-xl text-proton-muted"></i>
        </button>
      </div>
      <nav class="space-y-1">
        <a href="Dashboard__desktop.html" class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-proton-muted hover:bg-white/5 hover:text-white transition-colors text-sm">
          <i class="ph ph-squares-four text-base"></i> Dashboard
        </a>
        <a href="WorkItems__desktop.html" class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-proton-muted hover:bg-white/5 hover:text-white transition-colors text-sm">
          <i class="ph ph-list-checks text-base"></i> Work Items
        </a>
        <a href="Groups__desktop.html" class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-proton-muted hover:bg-white/5 hover:text-white transition-colors text-sm">
          <i class="ph ph-users-three text-base"></i> Groups
        </a>
        <a href="Notes__desktop.html" class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-proton-muted hover:bg-white/5 hover:text-white transition-colors text-sm">
          <i class="ph ph-note-pencil text-base"></i> Notes
        </a>
        <a href="Banking__desktop.html" class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-proton-muted hover:bg-white/5 hover:text-white transition-colors text-sm">

      </nav>
    </div>
  </aside>

  <main class="flex-1 overflow-y-auto no-scrollbar" id="main-content">
    <div class="max-w-6xl mx-auto px-6 py-12">
      
      <!-- Header -->
      <div class="flex items-end justify-between mb-12">
        <div>
          <h2 class="text-4xl font-extrabold tracking-tight mb-2">Tags</h2>
          <p class="text-proton-muted">Organize information across Work Items, Notes, and Banking.</p>
        </div>
        <button class="bg-proton-accent hover:bg-proton-accent/90 text-white px-5 py-2.5 rounded-2xl font-bold text-sm shadow-lg shadow-proton-accent/20 transition-all flex items-center gap-2">
          <i class="ph-bold ph-plus"></i> Create New Tag
        </button>
      </div>

      <!-- Search and Filter -->
      <div class="mb-8 p-4 bg-white/5 border border-white/5 rounded-[24px]">
        <div class="relative w-full md:w-96">
          <i class="ph ph-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-proton-muted"></i>
          <input type="text" placeholder="Search tags..." class="w-full bg-white/5 border border-white/10 rounded-xl pl-11 pr-4 py-2.5 focus:ring-2 focus:ring-proton-accent/50 outline-none transition-all text-sm">
        </div>
      </div>

      <!-- Tags List -->
      <div class="bg-white/5 border border-white/5 rounded-[32px] overflow-hidden">
        <table class="w-full text-left">
          <thead>
            <tr class="border-b border-white/5 bg-white/[0.02]">
              <th class="px-8 py-4 text-[10px] font-black text-proton-muted uppercase tracking-widest">Tag Name</th>
              <th class="px-8 py-4 text-[10px] font-black text-proton-muted uppercase tracking-widest">Usage</th>
              <th class="px-8 py-4 text-[10px] font-black text-proton-muted uppercase tracking-widest">Last Used</th>
              <th class="px-8 py-4 text-[10px] font-black text-proton-muted uppercase tracking-widest text-right">Actions</th>
            </tr>
          </thead>
          <tbody class="divide-y divide-white/5">
            <!-- Tag 1 -->
            <tr class="tag-row transition-colors group">
              <td class="px-8 py-6">
                <div class="flex items-center gap-3">
                  <div class="w-3 h-3 rounded-full bg-rose-500 shadow-[0_0_8px_rgba(244,63,94,0.4)]"></div>
                  <span class="font-bold">Urgent</span>
                </div>
              </td>
              <td class="px-8 py-6">
                <div class="flex gap-4">
                  <div class="flex items-center gap-1.5" title="Work Items">
                    <i class="ph ph-list-checks text-proton-muted"></i>
                    <span class="text-xs font-bold">12</span>
                  </div>
                  <div class="flex items-center gap-1.5" title="Notes">
                    <i class="ph ph-note-pencil text-proton-muted"></i>
                    <span class="text-xs font-bold">4</span>
                  </div>
                </div>
              </td>
              <td class="px-8 py-6 text-xs text-proton-muted font-medium">2 hours ago</td>
              <td class="px-8 py-6 text-right">
                <button class="p-2 hover:bg-white/10 rounded-lg text-proton-muted hover:text-white transition-colors"><i class="ph ph-pencil-simple text-lg"></i></button>
                <button class="p-2 hover:bg-rose-500/10 rounded-lg text-proton-muted hover:text-rose-400 transition-colors ml-2"><i class="ph ph-trash text-lg"></i></button>
              </td>
            </tr>

            <!-- Tag 2 -->
            <tr class="tag-row transition-colors group">
              <td class="px-8 py-6">
                <div class="flex items-center gap-3">
                  <div class="w-3 h-3 rounded-full bg-emerald-500 shadow-[0_0_8px_rgba(16,185,129,0.4)]"></div>
                  <span class="font-bold">Household</span>
                </div>
              </td>
              <td class="px-8 py-6">
                <div class="flex gap-4">
                  <div class="flex items-center gap-1.5">
                    <i class="ph ph-list-checks text-proton-muted"></i>
                    <span class="text-xs font-bold">45</span>
                  </div>
                  <div class="flex items-center gap-1.5">
                    <i class="ph ph-note-pencil text-proton-muted"></i>
                    <span class="text-xs font-bold">8</span>
                  </div>
                  <div class="flex items-center gap-1.5">
                    <i class="ph ph-wallet text-proton-muted"></i>
                    <span class="text-xs font-bold">3</span>
                  </div>
                </div>
              </td>
              <td class="px-8 py-6 text-xs text-proton-muted font-medium">Yesterday</td>
              <td class="px-8 py-6 text-right">
                <button class="p-2 hover:bg-white/10 rounded-lg text-proton-muted hover:text-white transition-colors"><i class="ph ph-pencil-simple text-lg"></i></button>
                <button class="p-2 hover:bg-rose-500/10 rounded-lg text-proton-muted hover:text-rose-400 transition-colors ml-2"><i class="ph ph-trash text-lg"></i></button>
              </td>
            </tr>

            <!-- Tag 3 -->
            <tr class="tag-row transition-colors group">
              <td class="px-8 py-6">
                <div class="flex items-center gap-3">
                  <div class="w-3 h-3 rounded-full bg-amber-500 shadow-[0_0_8px_rgba(245,158,11,0.4)]"></div>
                  <span class="font-bold">Shopping</span>
                </div>
              </td>
              <td class="px-8 py-6">
                <div class="flex gap-4">
                  <div class="flex items-center gap-1.5">
                    <i class="ph ph-list-checks text-proton-muted"></i>
                    <span class="text-xs font-bold">5</span>
                  </div>
                  <div class="flex items-center gap-1.5">
                    <i class="ph ph-wallet text-proton-muted"></i>
                    <span class="text-xs font-bold">22</span>
                  </div>
                </div>
              </td>
              <td class="px-8 py-6 text-xs text-proton-muted font-medium">3 days ago</td>
              <td class="px-8 py-6 text-right">
                <button class="p-2 hover:bg-white/10 rounded-lg text-proton-muted hover:text-white transition-colors"><i class="ph ph-pencil-simple text-lg"></i></button>
                <button class="p-2 hover:bg-rose-500/10 rounded-lg text-proton-muted hover:text-rose-400 transition-colors ml-2"><i class="ph ph-trash text-lg"></i></button>
              </td>
            </tr>

            <!-- Tag 4 -->
            <tr class="tag-row transition-colors group">
              <td class="px-8 py-6">
                <div class="flex items-center gap-3">
                  <div class="w-3 h-3 rounded-full bg-sky-500 shadow-[0_0_8px_rgba(14,165,233,0.4)]"></div>
                  <span class="font-bold">Finance</span>
                </div>
              </td>
              <td class="px-8 py-6">
                <div class="flex gap-4">
                  <div class="flex items-center gap-1.5">
                    <i class="ph ph-wallet text-proton-muted"></i>
                    <span class="text-xs font-bold">18</span>
                  </div>
                </div>
              </td>
              <td class="px-8 py-6 text-xs text-proton-muted font-medium">Oct 12, 2024</td>
              <td class="px-8 py-6 text-right">
                <button class="p-2 hover:bg-white/10 rounded-lg text-proton-muted hover:text-white transition-colors"><i class="ph ph-pencil-simple text-lg"></i></button>
                <button class="p-2 hover:bg-rose-500/10 rounded-lg text-proton-muted hover:text-rose-400 transition-colors ml-2"><i class="ph ph-trash text-lg"></i></button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <script>
    // Drawer Logic
    const drawerOpen = document.getElementById('drawer-open');
    const drawerClose = document.getElementById('drawer-close');
    const drawer = document.getElementById('drawer');
    const drawerOverlay = document.getElementById('drawer-overlay');

    const toggleDrawer = (open) => {
      if (open) {
        drawer.classList.remove('-translate-x-full');
        drawerOverlay.classList.add('opacity-100', 'pointer-events-auto');
      } else {
        drawer.classList.add('-translate-x-full');
        drawerOverlay.classList.remove('opacity-100', 'pointer-events-auto');
      }
    };

    drawerOpen.addEventListener('click', () => toggleDrawer(true));
    drawerClose.addEventListener('click', () => toggleDrawer(false));
    drawerOverlay.addEventListener('click', () => toggleDrawer(false));
  </script>
</body>
</html>
