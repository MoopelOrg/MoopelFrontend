<!DOCTYPE html>
<html lang="en">
<head>
    <script>
        window.FontAwesomeConfig = {
          autoReplaceSvg: 'nest'
        };
      </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Moopel — Add Storage Item</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['"Plus Jakarta Sans"', 'ui-sans-serif', 'system-ui', 'sans-serif'] },
          colors: {
            proton: {
              bg: '#0a0a14',
              surface: '#1a1a2e',
              accent: '#6d4aff',
              text: '#ffffff',
              muted: '#a1a1aa'
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      background: radial-gradient(circle at center, #1a1a2e 0%, #0a0a14 100%);
    }
  </style>
</head>
<body class="text-white font-sans min-h-screen w-full flex flex-col selection:bg-proton-accent/30 overflow-x-hidden">

  <!-- Header -->
  <header class="h-16 px-6 flex items-center justify-between border-b border-white/5 bg-proton-surface/50 backdrop-blur-sm sticky top-0 z-50">
    <div class="flex items-center gap-4">
      <a href="Storage__desktop.html" class="p-2 hover:bg-white/10 rounded-lg transition-colors text-proton-muted hover:text-white">
        <i class="ph ph-arrow-left text-2xl"></i>
      </a>
      <div class="flex items-center gap-2">
        <i class="ph-fill ph-package text-slate-400"></i>
        <span class="text-sm font-semibold">Add Item to Storage</span>
      </div>
    </div>
    <div class="flex items-center gap-3">
       <button class="px-5 py-2 rounded-xl text-sm font-bold text-proton-muted hover:text-white transition-colors">Discard</button>
       <button class="bg-proton-accent hover:bg-proton-accent/90 text-white px-6 py-2 rounded-xl font-bold text-sm shadow-lg shadow-proton-accent/20 transition-all">Add Item</button>
    </div>
  </header>

  <main class="flex-1 max-w-2xl mx-auto w-full px-6 py-12">
    <div class="space-y-12">
      
      <!-- Basic Info -->
      <section class="space-y-6">
        <div class="space-y-2">
          <label class="text-xs font-bold text-proton-muted ml-1">Item Name</label>
          <input type="text" placeholder="e.g. Cordless Drill, Xmas Tree, Winter Boots..." class="w-full bg-white/5 border border-white/10 rounded-2xl px-4 py-4 focus:ring-2 focus:ring-proton-accent/50 outline-none transition-all text-lg font-bold">
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div class="space-y-2">
            <label class="text-xs font-bold text-proton-muted ml-1">Box / Container ID</label>
            <div class="relative">
               <i class="ph ph-hash absolute left-4 top-1/2 -translate-y-1/2 text-proton-muted"></i>
               <input type="text" placeholder="e.g. Box 12, Blue Bin A" class="w-full bg-white/5 border border-white/10 rounded-2xl pl-11 pr-4 py-3.5 focus:ring-2 focus:ring-proton-accent/50 outline-none transition-all text-sm font-medium">
            </div>
          </div>
          <div class="space-y-2">
            <label class="text-xs font-bold text-proton-muted ml-1">Category</label>
            <select class="w-full bg-proton-surface border border-white/10 rounded-2xl px-4 py-3.5 focus:ring-2 focus:ring-proton-accent/50 outline-none transition-all text-sm font-medium cursor-pointer">
              <option>Tools & Hardware</option>
              <option>Holiday Decorations</option>
              <option>Apparel & Footwear</option>
              <option>Electronics</option>
              <option>Documents/Archives</option>
              <option>Sports & Outdoors</option>
            </select>
          </div>
        </div>
      </section>

      <!-- Location & Placement -->
      <section>
        <h2 class="text-[10px] font-black text-proton-muted uppercase tracking-[0.2em] mb-8">Location Details</h2>
        <div class="space-y-6">
          <div class="space-y-2">
            <label class="text-xs font-bold text-proton-muted ml-1">Storage Area</label>
            <select class="w-full bg-proton-surface border border-white/10 rounded-2xl px-4 py-3.5 focus:ring-2 focus:ring-proton-accent/50 outline-none transition-all text-sm font-medium cursor-pointer">
              <option>Garage (Main)</option>
              <option>Attic (North Side)</option>
              <option>Basement Storage</option>
            </select>
          </div>
          <div class="space-y-2">
            <label class="text-xs font-bold text-proton-muted ml-1">Shelf / Sub-location</label>
            <input type="text" placeholder="e.g. Shelf 4, Bottom Left, Behind Workbench..." class="w-full bg-white/5 border border-white/10 rounded-2xl px-4 py-3.5 focus:ring-2 focus:ring-proton-accent/50 outline-none transition-all text-sm font-medium">
          </div>
        </div>
      </section>

      <!-- Additional Info -->
      <section>
        <h2 class="text-[10px] font-black text-proton-muted uppercase tracking-[0.2em] mb-8">Properties</h2>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
           <div class="space-y-2">
             <label class="text-xs font-bold text-proton-muted ml-1">Owner</label>
             <select class="w-full bg-proton-surface border border-white/10 rounded-2xl px-4 py-3.5 focus:ring-2 focus:ring-proton-accent/50 outline-none transition-all text-sm font-medium cursor-pointer">
               <option>Household (Shared)</option>
               <option>Erik</option>
               <option>Sarah</option>
             </select>
           </div>
           <div class="space-y-2">
             <label class="text-xs font-bold text-proton-muted ml-1">Condition</label>
             <select class="w-full bg-proton-surface border border-white/10 rounded-2xl px-4 py-3.5 focus:ring-2 focus:ring-proton-accent/50 outline-none transition-all text-sm font-medium cursor-pointer">
               <option>Good</option>
               <option>Used</option>
               <option>Needs Repair</option>
               <option>For Sale/Donate</option>
             </select>
           </div>
        </div>
      </section>

    </div>
  </main>
</body>
</html>
