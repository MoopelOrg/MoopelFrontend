<!DOCTYPE html>
<html lang="en">
<head>
    <script>
        window.FontAwesomeConfig = {
          autoReplaceSvg: 'nest'
        };
      </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Moopel — Create Account</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['"Plus Jakarta Sans"', 'ui-sans-serif', 'system-ui', 'sans-serif'] },
          colors: {
            proton: {
              bg: '#0a0a14',
              surface: '#1a1a2e',
              accent: '#6d4aff',
              text: '#ffffff',
              muted: '#a1a1aa'
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      background: radial-gradient(circle at center, #1a1a2e 0%, #0a0a14 100%);
    }
    .register-card {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    /* Custom Checkbox */
    .check-container input:checked ~ .checkmark {
      background-color: #6d4aff;
      border-color: #6d4aff;
    }
    .checkmark:after {
      content: "";
      position: absolute;
      display: none;
      left: 6px;
      top: 2px;
      width: 5px;
      height: 10px;
      border: solid white;
      border-width: 0 2px 2px 0;
      transform: rotate(45deg);
    }
    .check-container input:checked ~ .checkmark:after { display: block; }
  </style>
</head>
<body class="text-white font-sans min-h-screen w-full flex items-center justify-center p-6 py-12 selection:bg-proton-accent/30">

  <div class="w-full max-w-md">
    <!-- Logo & Header -->
    <div class="text-center mb-10">
      <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-proton-accent mb-6 shadow-2xl shadow-proton-accent/40">
        <i class="ph-fill ph-house-line text-white text-3xl"></i>
      </div>
      <h1 class="text-3xl font-extrabold tracking-tight mb-2">Create Account</h1>
      <p class="text-proton-muted">Join Moopel and start managing your household.</p>
    </div>

    <!-- Register Card -->
    <div class="register-card p-10 rounded-[40px] shadow-2xl">
      <form class="space-y-6">
        <!-- Name Field -->
        <div class="space-y-2">
          <label class="text-[10px] font-black text-proton-muted uppercase tracking-widest px-1">Full Name</label>
          <div class="relative">
            <i class="ph ph-user absolute left-5 top-1/2 -translate-y-1/2 text-proton-muted"></i>
            <input type="text" placeholder="John Doe" class="w-full bg-white/5 border border-white/10 rounded-2xl pl-12 pr-5 py-4 focus:ring-2 focus:ring-proton-accent/50 outline-none transition-all font-medium text-sm">
          </div>
        </div>

        <!-- Email Field -->
        <div class="space-y-2">
          <label class="text-[10px] font-black text-proton-muted uppercase tracking-widest px-1">Email Address</label>
          <div class="relative">
            <i class="ph ph-envelope-simple absolute left-5 top-1/2 -translate-y-1/2 text-proton-muted"></i>
            <input type="email" placeholder="name@example.com" class="w-full bg-white/5 border border-white/10 rounded-2xl pl-12 pr-5 py-4 focus:ring-2 focus:ring-proton-accent/50 outline-none transition-all font-medium text-sm">
          </div>
        </div>

        <!-- Password Field -->
        <div class="space-y-2">
          <label class="text-[10px] font-black text-proton-muted uppercase tracking-widest px-1">Password</label>
          <div class="relative">
            <i class="ph ph-lock-simple absolute left-5 top-1/2 -translate-y-1/2 text-proton-muted"></i>
            <input type="password" placeholder="Create a strong password" class="w-full bg-white/5 border border-white/10 rounded-2xl pl-12 pr-12 py-4 focus:ring-2 focus:ring-proton-accent/50 outline-none transition-all font-medium text-sm">
            <button type="button" class="absolute right-5 top-1/2 -translate-y-1/2 text-proton-muted hover:text-white transition-colors">
              <i class="ph ph-eye text-lg"></i>
            </button>
          </div>
        </div>

        <!-- Confirm Password Field -->
        <div class="space-y-2">
          <label class="text-[10px] font-black text-proton-muted uppercase tracking-widest px-1">Confirm Password</label>
          <div class="relative">
            <i class="ph ph-lock-simple absolute left-5 top-1/2 -translate-y-1/2 text-proton-muted"></i>
            <input type="password" placeholder="Repeat your password" class="w-full bg-white/5 border border-white/10 rounded-2xl pl-12 pr-12 py-4 focus:ring-2 focus:ring-proton-accent/50 outline-none transition-all font-medium text-sm">
          </div>
        </div>

        <!-- Terms & Conditions -->
        <div class="flex items-start gap-3">
          <label class="check-container relative block cursor-pointer flex-shrink-0 mt-0.5">
            <input type="checkbox" class="absolute opacity-0 cursor-pointer h-0 w-0">
            <span class="checkmark block h-5 w-5 bg-white/10 border border-white/20 rounded-md transition-all"></span>
          </label>
          <span class="text-xs font-bold text-proton-muted leading-relaxed">
            I agree to the <a href="#" class="text-proton-accent hover:underline">Terms of Service</a> and <a href="#" class="text-proton-accent hover:underline">Privacy Policy</a>.
          </span>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="w-full bg-proton-accent hover:bg-proton-accent/90 text-white py-4 rounded-2xl font-bold text-sm shadow-xl shadow-proton-accent/30 transition-all transform hover:scale-[1.02] active:scale-[0.98]">
          Create Account
        </button>
      </form>

      <!-- Social Login Divider -->
      <div class="relative my-8">
        <div class="absolute inset-0 flex items-center">
          <div class="w-full border-t border-white/5"></div>
        </div>
        <div class="relative flex justify-center text-[10px] font-black uppercase tracking-widest">
          <span class="px-4 bg-proton-surface/50 text-proton-muted">Or sign up with</span>
        </div>
      </div>

      <!-- Social Buttons -->
      <div class="grid grid-cols-2 gap-4">
        <button class="flex items-center justify-center gap-3 bg-white/5 border border-white/10 py-3.5 rounded-2xl text-xs font-bold hover:bg-white/10 transition-all">
          <i class="ph-fill ph-google-logo text-lg text-rose-400"></i> Google
        </button>
        <button class="flex items-center justify-center gap-3 bg-white/5 border border-white/10 py-3.5 rounded-2xl text-xs font-bold hover:bg-white/10 transition-all">
          <i class="ph-fill ph-apple-logo text-lg"></i> Apple
        </button>
      </div>
    </div>

    <!-- Footer -->
    <div class="text-center mt-8 pb-12">
      <p class="text-sm text-proton-muted">
        Already have an account? 
        <a href="Login__desktop.html" class="font-bold text-proton-accent hover:underline">Sign In</a>
      </p>
    </div>
  </div>

</body>
</html>
