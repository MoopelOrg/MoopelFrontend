name: BuildAndTest

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'

      - name: Restore
        run: dotnet restore MoopelFrontend.slnx

      - name: Check vulnerable packages
        run: dotnet list MoopelFrontend.slnx package --vulnerable --include-transitive

      - name: Build
        run: dotnet build MoopelFrontend.slnx --configuration Release --no-restore --warnaserror

      - name: Check formatting
        run: dotnet format MoopelFrontend.slnx --verify-no-changes --no-restore

      - name: Test
        continue-on-error: true
        run: >
          dotnet test MoopelFrontend.slnx
          --configuration Release
          --no-build
          --collect:"XPlat Code Coverage"
          --results-directory ./TestResults
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/
