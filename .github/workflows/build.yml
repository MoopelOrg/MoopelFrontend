name: BuildAndTest

on:
  push:
    branches:
      - '**'
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: build-and-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate workflow policy
        shell: pwsh
        run: ./.github/scripts/Test-WorkflowPolicy.ps1

      - name: Set build metadata
        shell: bash
        run: |
          echo "BUILD_NUMBER=${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "COMMIT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          echo "BRANCH_NAME=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          echo "BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> "$GITHUB_ENV"
          echo "GIT_TAG=${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}" >> "$GITHUB_ENV"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'

      - name: Restore
        run: dotnet restore MoopelFrontend.slnx

      - name: Build
        run: dotnet build MoopelFrontend.slnx --configuration Release --no-restore --warnaserror

      - name: Check formatting
        run: dotnet format MoopelFrontend.slnx --verify-no-changes --no-restore

      - name: Install Playwright browsers
        run: pwsh MoopelFrontend.Tests/bin/Release/net11.0/playwright.ps1 install --with-deps chromium

      - name: Test
        run: >
          dotnet test MoopelFrontend.slnx
          --configuration Release
          --no-build
          --collect:"XPlat Code Coverage"
          --results-directory ./TestResults

      - name: Publish
        run: dotnet publish MoopelFrontend/MoopelFrontend.csproj --configuration Release --no-build --output ./publish

      - name: Create build metadata
        shell: bash
        run: |
          cat > ./publish/build-info.json <<EOF
          {
            "buildNumber": "$BUILD_NUMBER",
            "commitSha": "$COMMIT_SHA",
            "branch": "$BRANCH_NAME",
            "buildDate": "$BUILD_DATE",
            "gitTag": "$GIT_TAG"
          }
          EOF

      - name: Build Docker image
        env:
          IMAGE_NAME: ghcr.io/moopelorg/moopelfrontend
        run: |
          TAG_ARGS=("--tag" "$IMAGE_NAME:${{ github.sha }}" "--tag" "moopelfrontend:${{ github.sha }}")
          TAG_ARGS+=("--tag" "moopelfrontend:${{ github.run_id }}")

          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            TAG_ARGS+=("--tag" "$IMAGE_NAME:latest" "--tag" "moopelfrontend:latest")
          fi

          if [ -n "$GIT_TAG" ]; then
            TAG_ARGS+=("--tag" "$IMAGE_NAME:$GIT_TAG" "--tag" "moopelfrontend:$GIT_TAG")
          fi

          docker build "${TAG_ARGS[@]}" .

      - name: Save Docker image
        run: |
          docker save \
            ghcr.io/moopelorg/moopelfrontend:${{ github.sha }} \
            moopelfrontend:${{ github.sha }} \
            --output ./moopelfrontend.tar

      - name: Upload Docker image
        uses: actions/upload-artifact@v4
        with:
          name: moopelfrontend-docker-${{ github.sha }}
          path: ./moopelfrontend.tar
          retention-days: 7

      - name: Upload application artifact
        uses: actions/upload-artifact@v4
        with:
          name: MoopelFrontend-${{ github.run_id }}
          path: ./publish/
          retention-days: 7

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.run_id }}
          path: TestResults/
          if-no-files-found: warn
          retention-days: 7
