name: Deploy

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: "Build number to deploy"
        required: true
        type: string

      run_id:
        description: "BuildAndTest run ID to deploy"
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: [self-hosted, Windows, X64, moopel-server]

    steps:
      - name: Verify runner
        shell: pwsh
        run: |
          Write-Host "Runner: $env:RUNNER_NAME"
          Write-Host "OS: $env:RUNNER_OS"
          Write-Host "Architecture: $env:RUNNER_ARCH"
          Write-Host "Machine: $env:COMPUTERNAME"

      - name: Download Docker image
        uses: actions/download-artifact@v7
        with:
          name: MoopelFrontend-Docker-${{ inputs.build_number }}
          path: .
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.run_id }}

      - name: Load Docker image
        shell: pwsh
        run: |
          $env:DOCKER_CONFIG = "C:\Users\MoopelRunner\.docker"
          docker load --input ./moopelfrontend.tar

      - name: Verify deployment directory
        shell: pwsh
        run: |
          Write-Host "User: $env:USERNAME"
          Write-Host "Working directory: $PWD"
          Write-Host "Deployment test successful."
