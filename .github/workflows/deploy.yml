name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy to"
        required: true
        type: choice
        options:
          - Test
          - Development
          - Staging

      build_number:
        description: "Build number to deploy"
        required: true
        type: string

      run_id:
        description: "BuildAndTest run ID to deploy"
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate build provenance
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.provenance.outputs.environment }}
      container_name: ${{ steps.provenance.outputs.container_name }}
      image_tag: ${{ steps.provenance.outputs.image_tag }}
    steps:
      - name: Validate build provenance
        id: provenance
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $headers = @{
            Accept = "application/vnd.github+json"
            Authorization = "Bearer $env:GH_TOKEN"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $run = Invoke-RestMethod `
            -Headers $headers `
            -Uri "https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ inputs.run_id }}"

          if ($run.name -ne "BuildAndTest" -or $run.conclusion -ne "success") {
            throw "The selected run must be a successful BuildAndTest run."
          }
          if ($run.run_number.ToString() -ne "${{ inputs.build_number }}") {
            throw "The build number does not match the selected run."
          }

          switch ("${{ inputs.environment }}") {
            "Development" {
              if ($run.event -ne "push" -or $run.head_branch -eq "main") {
                throw "Development requires a non-main push build."
              }
              $containerName = "moopelfrontend-development"
            }
            "Test" {
              if ($run.event -ne "pull_request" -or
                  $run.head_repository.full_name -ne "${{ github.repository }}") {
                throw "Test requires a same-repository pull request build."
              }
              $containerName = "moopelfrontend-test"
            }
            "Staging" {
              if ($run.event -ne "push" -or $run.head_branch -ne "main") {
                throw "Staging requires a main push build."
              }
              $containerName = "moopelfrontend-staging"
            }
          }

          "environment=${{ inputs.environment }}" >> $env:GITHUB_OUTPUT
          "container_name=$containerName" >> $env:GITHUB_OUTPUT
          "image_tag=$($run.head_sha)" >> $env:GITHUB_OUTPUT

  deploy:
    name: Deploy
    needs: validate
    uses: ./.github/workflows/_deploy.yml
    with:
      environment_name: ${{ needs.validate.outputs.environment }}
      container_name: ${{ needs.validate.outputs.container_name }}
      image_tag: ${{ needs.validate.outputs.image_tag }}
      run_id: ${{ inputs.run_id }}
      run_smoke_tests: true
    secrets: inherit