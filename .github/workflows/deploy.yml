name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy to"
        required: true
        type: choice
        options:
          - Test
          - Development
          - Staging

      build_number:
        description: "Build number to deploy"
        required: true
        type: string

      run_id:
        description: "BuildAndTest run ID to deploy"
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: [self-hosted, Windows, X64, moopel-server]
    environment: ${{ inputs.environment }}

    env:
      DOCKER_CONFIG: C:\Users\MoopelRunner\.docker

    steps:
      - name: Verify runner
        shell: pwsh
        run: |
          Write-Host "Runner: $env:RUNNER_NAME"
          Write-Host "OS: $env:RUNNER_OS"
          Write-Host "Architecture: $env:RUNNER_ARCH"
          Write-Host "Machine: $env:COMPUTERNAME"

      - name: Validate build provenance
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $headers = @{
            Accept = "application/vnd.github+json"
            Authorization = "Bearer $env:GH_TOKEN"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $run = Invoke-RestMethod `
            -Headers $headers `
            -Uri "https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ inputs.run_id }}"

          if ($run.name -ne "BuildAndTest" -or $run.conclusion -ne "success") {
            throw "The selected run must be a successful BuildAndTest run."
          }
          if ($run.run_number.ToString() -ne "${{ inputs.build_number }}") {
            throw "The build number does not match the selected run."
          }

          switch ("${{ inputs.environment }}") {
            "Development" {
              if ($run.event -ne "push" -or $run.head_branch -eq "main") {
                throw "Development requires a non-main push build."
              }
              $containerName = "moopelfrontend-development"
              $hostPort = 8082
            }
            "Test" {
              if ($run.event -ne "pull_request" -or
                  $run.head_repository.full_name -ne "${{ github.repository }}") {
                throw "Test requires a same-repository pull request build."
              }
              $containerName = "moopelfrontend-test"
              $hostPort = 8081
            }
            "Staging" {
              if ($run.event -ne "push" -or $run.head_branch -ne "main") {
                throw "Staging requires a main push build."
              }
              $containerName = "moopelfrontend-staging"
              $hostPort = 8083
            }
          }

          "CONTAINER_NAME=$containerName" >> $env:GITHUB_ENV
          "HOST_PORT=$hostPort" >> $env:GITHUB_ENV
          "IMAGE_TAG=moopelfrontend:${{ inputs.run_id }}" >> $env:GITHUB_ENV

      - name: Checkout trusted deployment scripts
        uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false

      - name: Download Docker image
        uses: actions/download-artifact@v8
        with:
          name: MoopelFrontend-Docker-${{ inputs.run_id }}
          path: .
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.run_id }}

      - name: Load Docker image
        shell: pwsh
        run: docker load --input ./moopelfrontend.tar

      - name: Deploy container
        shell: pwsh
        env:
          DEPLOY_API_BASE_URL: ${{ secrets.MOOPEL_API_BASE_URL }}
        run: >
          ./.github/scripts/Deploy-Container.ps1
          -ContainerName $env:CONTAINER_NAME
          -ImageTag $env:IMAGE_TAG
          -HostPort $env:HOST_PORT
          -EnvironmentName '${{ vars.ENVIRONMENT }}'
          -ApiBaseUrl $env:DEPLOY_API_BASE_URL
