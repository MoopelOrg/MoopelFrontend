name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy to"
        required: true
        type: choice
        options:
          - Test
          - Development
          - Production

      run_id:
        description: "BuildAndTest run ID to deploy"
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: [self-hosted, Windows, X64, moopel-server]

    steps:
      - name: Verify runner
        shell: pwsh
        run: |
          Write-Host "Runner: $env:RUNNER_NAME"
          Write-Host "OS: $env:RUNNER_OS"
          Write-Host "Architecture: $env:RUNNER_ARCH"
          Write-Host "Machine: $env:COMPUTERNAME"

      - name: Download Docker image
        uses: actions/download-artifact@v7
        with:
          name: MoopelFrontend-Docker-${{ inputs.build_number }}
          path: .
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.run_id }}

      - name: Load Docker image
        shell: pwsh
        run: |
          $env:DOCKER_CONFIG = "C:\Users\MoopelRunner\.docker"
          docker load --input ./moopelfrontend.tar

      - name: Deploy container
        shell: pwsh
        run: |
          docker rm -f moopelfrontend 2>$null
          
          docker run -d `
            --name moopelfrontend `
            -p 8080:8080 `
            -e "Environment=${{ vars.ENVIRONMENT }}" `
            -e "MoopelApiOptions__BaseUrl=${{ secrets.MOOPEL_API_BASE_URL }}" `
            moopelfrontend:${{ inputs.build_number }}
